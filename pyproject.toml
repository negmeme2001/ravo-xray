[project]
name = "ravo-xray"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "psycopg[binary]",
    "pgvector",
    "openai",
    "upstash-redis",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pdfplumber",
    "fpdf2",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real Postgres via DATABASE_URL",
]
